<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서울 날씨 AI 비서</title><link rel="stylesheet" href="style.css"></head><body><header><h1>서울 날씨 AI 비서</h1><p>저장된 시계열 데이터를 이해하고 답하는 맞춤형 AI</p></header><main class="layout"><section class="card"><h2>데이터 요약</h2><div id="summary">불러오는 중...</div></section><section class="card"><h2>AI 채팅</h2><div id="messages" class="messages"><div class="message assistant">저장된 서울 기온 데이터에 대해 질문해보세요.</div></div><div class="chat-input"><input id="question" placeholder="예: 전체 평균 기온과 최근 추세를 알려줘"><button id="send">전송</button></div></section><section class="card wide"><h2>데이터 관리</h2><form id="dataForm"><input id="date" type="date" required><input id="value" type="number" step="0.01" placeholder="평균 기온(°C)" required><input id="memo" placeholder="메모"><button>추가</button></form><p class="hint">최근 30개 데이터만 표시합니다.</p><div class="table-wrap"><table><thead><tr><th>날짜</th><th>값</th><th>메모</th><th>관리</th></tr></thead><tbody id="dataRows"></tbody></table></div></section><section class="card wide"><h2>대화 기록</h2><div id="conversationList">불러오는 중...</div></section></main><script src="config.js"></script><script src="app.js"></script></body></html>
